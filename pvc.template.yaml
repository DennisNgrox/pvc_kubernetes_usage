zabbix_export:
  version: '6.0'
  date: '2025-06-11T21:28:27Z'
  groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 4c542f97dbf24c5995359f450e76462e
      template: 'Kubernetes Filesystem and PVC Usage by HTTP'
      name: 'Kubernetes Filesystem and PVC Usage by HTTP'
      groups:
        - name: Templates/Applications
      items:
        - uuid: 7b7841ef8a3248b0a431b8fb02733ce8
          name: 'Kubernetes: Get cadvisor metrics'
          type: HTTP_AGENT
          key: kube.cadvisor.metrics
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Collecting raw Kubelet metrics from /metrics/cadvisor endpoint.'
          timeout: 10s
          url: '{$KUBE.KUBELET.URL}{$KUBE.KUBELET.CADVISOR.ENDPOINT}'
          status_codes: '200, 403'
          headers:
            - name: Authorization
              value: 'Bearer {$KUBE.API.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: 7ee54760a05c4c2692d9fbd7d300d8e7
          name: 'Kubernetes: Get kubelet metrics'
          type: HTTP_AGENT
          key: kube.kubelet.metrics
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Collecting raw Kubelet metrics from /metrics endpoint.'
          timeout: 10s
          url: '{$KUBE.KUBELET.URL}{$KUBE.KUBELET.METRIC.ENDPOINT}'
          status_codes: '200, 403'
          headers:
            - name: Authorization
              value: 'Bearer {$KUBE.API.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: ce34792cb83e4c3db2c6d6fd569282e1
          name: 'Kubernetes: Get Nodes Metrics'
          type: HTTP_AGENT
          key: nodes.metrics
          trends: '0'
          value_type: TEXT
          url: 'http://{HOST.CONN}:{$PORT_NODE_METRICS}/metrics'
      discovery_rules:
        - uuid: 3354add0363e46f7b503b3b00d368674
          name: 'Get Nodes Metrics Filesystem'
          type: DEPENDENT
          key: node.metrics.filesystem
          delay: '0'
          item_prototypes:
            - uuid: 7cd15415108244879eeb4adf6f30fc23
              name: 'Filesystem {#MOUNTPOINT} - Space Used in %'
              type: CALCULATED
              key: 'filesystem.used.percent[{#MOUNTPOINT} - {#DEVICE}]'
              value_type: FLOAT
              units: '%'
              params: '100 * last(//get.filesystem.used[{#MOUNTPOINT} - {#DEVICE}]) / last(//get.filesystem.total[{#MOUNTPOINT} - {#DEVICE}])'
            - uuid: 8509beed2d674654b1261ab9702cae47
              name: 'Filesystem {#MOUNTPOINT} - Space Free'
              type: DEPENDENT
              key: 'get.filesystem.free[{#MOUNTPOINT} - {#DEVICE}]'
              delay: '0'
              units: B
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'node_filesystem_free_bytes{device="{#DEVICE}", mountpoint="{#MOUNTPOINT}"}'
                    - value
                    - ''
                - type: JAVASCRIPT
                  parameters:
                    - 'return parseFloat(value);'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3h
              master_item:
                key: nodes.metrics
            - uuid: dc594eb0f9954dedb1044336e4b4a692
              name: 'Filesystem {#MOUNTPOINT} - Space Total'
              type: DEPENDENT
              key: 'get.filesystem.total[{#MOUNTPOINT} - {#DEVICE}]'
              delay: '0'
              units: B
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'node_filesystem_size_bytes{device="{#DEVICE}", mountpoint="{#MOUNTPOINT}"}'
                    - value
                    - ''
                - type: JAVASCRIPT
                  parameters:
                    - 'return parseFloat(value);'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3h
              master_item:
                key: nodes.metrics
            - uuid: 4b20bd5c7f6240ac8e3410e7b91a1ed0
              name: 'Filesystem {#MOUNTPOINT} - Space Used'
              type: CALCULATED
              key: 'get.filesystem.used[{#MOUNTPOINT} - {#DEVICE}]'
              units: B
              params: 'last(//get.filesystem.total[{#MOUNTPOINT} - {#DEVICE}]) - last(//get.filesystem.free[{#MOUNTPOINT} - {#DEVICE}])'
          master_item:
            key: nodes.metrics
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - '{__name__=~"node_filesystem_size_bytes", mountpoint=~".*"}'
            - type: JAVASCRIPT
              parameters:
                - |
                  var lookup = {},
                      result = [];
                  
                  JSON.parse(value).forEach(function(item) {
                      if (item.name === 'node_filesystem_size_bytes') {
                          var mount = item.labels.mountpoint;
                          var dev = item.labels.device;
                          var fs = item.labels.fstype;
                  
                          if (!mount || !dev || !fs) {
                              return;
                          }
                  
                          var key = mount + '/' + dev + '/' + fs;
                          if (lookup[key]) {
                              return;
                          }
                          lookup[key] = 1;
                  
                          result.push({
                              '{#MOUNTPOINT}': mount,
                              '{#DEVICE}': dev,
                              '{#FSTYPE}': fs
                          });
                      }
                  });
                  
                  return JSON.stringify(result);
                  
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
        - uuid: b91a4e79200646ef9fe2be97bfe2106d
          name: PVC
          type: DEPENDENT
          key: pvc.key
          delay: '0'
          item_prototypes:
            - uuid: d087f416f6f64055b598c978b55064ed
              name: 'PVC {#PVC} - NAMESPACE {#NAMESPACE} - Usage in %'
              type: CALCULATED
              key: 'calculate[{#PVC} - {#NAMESPACE}]'
              value_type: FLOAT
              units: '%'
              params: '100 * last(//pvc[{#PVC} - {#NAMESPACE} - Usage]) / last(//pvc[{#PVC} - {#NAMESPACE} - Total])'
            - uuid: 47b5b77a64ad48259bed66a73a7325d3
              name: 'PVC {#PVC} - NAMESPACE {#NAMESPACE} - Space Available'
              type: DEPENDENT
              key: 'pvc[{#PVC} - {#NAMESPACE} - Available]'
              delay: '0'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'kubelet_volume_stats_available_bytes{namespace="{#NAMESPACE}", persistentvolumeclaim="{#PVC}"}'
                    - value
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3h
              master_item:
                key: kube.kubelet.metrics
            - uuid: 1914177a1dd744e9bc8c65e46c4f559b
              name: 'PVC {#PVC} - NAMESPACE {#NAMESPACE} - Space Total'
              type: DEPENDENT
              key: 'pvc[{#PVC} - {#NAMESPACE} - Total]'
              delay: '0'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'kubelet_volume_stats_capacity_bytes{namespace="{#NAMESPACE}", persistentvolumeclaim="{#PVC}"}'
                    - value
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3h
              master_item:
                key: kube.kubelet.metrics
            - uuid: 2043374e630448ed800033405fe50504
              name: 'PVC {#PVC} - NAMESPACE {#NAMESPACE} - Space Usage'
              type: DEPENDENT
              key: 'pvc[{#PVC} - {#NAMESPACE} - Usage]'
              delay: '0'
              value_type: FLOAT
              units: B
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'kubelet_volume_stats_used_bytes{namespace="{#NAMESPACE}", persistentvolumeclaim="{#PVC}"}'
                    - value
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 3h
              master_item:
                key: kube.kubelet.metrics
          master_item:
            key: kube.kubelet.metrics
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - '{__name__=~"kubelet_volume_stats_used_bytes", persistentvolumeclaim=~".*"}'
            - type: JAVASCRIPT
              parameters:
                - |
                  var lookup = {},
                      result = [];
                  
                  JSON.parse(value).forEach(function(item) {
                      if (item.name === 'kubelet_volume_stats_used_bytes') {
                          var pvc = item.labels.persistentvolumeclaim;
                          var ns = item.labels.namespace;
                  
                          if (!pvc || !ns) {
                              return;
                          }
                  
                          var key = ns + '/' + pvc;
                          if (lookup[key]) {
                              return;
                          }
                          lookup[key] = 1;
                  
                          result.push({
                              '{#NAMESPACE}': ns,
                              '{#PVC}': pvc
                          });
                      }
                  });
                  
                  return JSON.stringify(result);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 3h
      tags:
        - tag: class
          value: software
        - tag: target
          value: kubelet
        - tag: target
          value: kubernetes
      macros:
